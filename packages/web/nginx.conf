# nginx.conf - Configuracion de produccion del frontend (Vite + React) de AlentApp.
# Reemplaza /etc/nginx/nginx.conf. La politica del servidor vive aqui, versionada y
# auditable aparte de la imagen ("Localizar parametros de configuracion", Sommerville).

worker_processes auto;

# El pid se ubica en /var/run, montado como tmpfs (escribible) por la parte c)
# cuando el contenedor corre con read_only: true.
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs a stdout/stderr: el contenedor no escribe en disco, compatible con
    # read_only: true (la parte c) no monta tmpfs sobre /var/log/nginx).
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    # Rutas temporales en /var/cache/nginx, montado como tmpfs por la parte c).
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # --- Compresion gzip sobre tipos de texto (ahorra ancho de banda) ---
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # --- Cache por tipo de recurso ---
    # Los assets de Vite llevan hash en el nombre (cache-busting), por lo que son
    # inmutables; el index.html debe revalidarse en cada deploy.
    map $uri $cache_control {
        default                                                              "no-cache";
        ~*\.(?:js|mjs|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|ico|webp)$     "public, max-age=31536000, immutable";
    }

    server {
        listen      80;
        listen      [::]:80;  # IPv6: el healthcheck usa localhost, que resuelve a ::1
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # --- Cabeceras de seguridad (XSS, clickjacking, MIME-sniffing) ---
        # Se declaran a nivel server y, al no existir add_header en el unico
        # location, se heredan en todas las respuestas.
        add_header X-Frame-Options        "DENY"                                                                            always;
        add_header X-Content-Type-Options "nosniff"                                                                         always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"                                                 always;

        # Cache-Control resuelto por el map de arriba (immutable para assets,
        # no-cache para index.html y rutas de la SPA).
        add_header Cache-Control $cache_control always;

        # --- Fallback de SPA: el ruteo de React Router funciona en recargas y
        # rutas profundas sirviendo index.html cuando el archivo no existe. ---
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
